name: Release Beta

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to build from. Leave empty to use HEAD.'
        required: false
        default: ''
      display_dj_cli_version:
        description: 'display-dj-cli version to use (e.g. v0.4.1). Leave empty for default from package.json.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      body: ${{ steps.body.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit and beta tag
        id: resolve
        run: |
          INPUT_SHA="${{ github.event.inputs.sha }}"
          if [ -n "$INPUT_SHA" ]; then
            # Checkout the requested SHA
            git checkout "$INPUT_SHA"
            FULL_SHA=$(git rev-parse HEAD)
          else
            FULL_SHA=$(git rev-parse HEAD)
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%d-%H-%M')
          TAG="release-beta-${DATE}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        id: body
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          FULL_SHA: ${{ steps.resolve.outputs.sha }}
          SHORT_SHA: ${{ steps.resolve.outputs.short_sha }}
        run: |
          # Recent commits (max 10) from the resolved SHA
          CHANGELOG=$(git log --oneline --no-decorate -10 "$FULL_SHA")

          {
            echo "## Display DJ Beta — \`${SHORT_SHA}\`"
            echo ""
            echo "> **This is a beta build** from commit [\`${FULL_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${FULL_SHA}). Use at your own risk."
            echo ""
            echo "### Recent Changes"
            echo ""
            echo '```'
            echo "$CHANGELOG"
            echo '```'
            echo ""
            echo "### Supported Platforms"
            echo "- **macOS** Apple Silicon (ARM64) - \`.dmg\`"
            echo "- **macOS** Intel (x64) - \`.dmg\`"
            echo "- **Windows** (x64) - \`.exe\`"
            echo "- **Linux** (x64) - \`.deb\` / \`.AppImage\`"
          } > body.md

          {
            echo "body<<BODY_EOF"
            cat body.md
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  cleanup:
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

  release:
    needs: [resolve-tag, cleanup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPLAY_DJ_CLI_VERSION: ${{ github.event.inputs.display_dj_cli_version }}
        with:
          tagName: ${{ needs.resolve-tag.outputs.tag }}
          releaseName: 'Display DJ Beta (${{ needs.resolve-tag.outputs.tag }})'
          releaseBody: ${{ needs.resolve-tag.outputs.body }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
