name: Build

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:
    inputs:
      display_dj_cli_version:
        description: 'display-dj-cli version to use (e.g. v0.4.1). Leave empty for default from package.json.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macOS (Apple Silicon ARM64)
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macOS (Intel x64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: Windows (x64)
          # Native arm64 build on GitHub's Windows 11 arm64 runner (free and
          # unlimited on public repos). Not a cross-compile - the toolchain,
          # tests and NSIS bundle all run on real arm64 hardware.
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_name: Windows (ARM64)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: Linux (x64)
          # Native arm64 Linux build (Raspberry Pi, Ampere, Asahi, arm64 VMs).
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: Linux (ARM64)

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        # Matches both ubuntu-22.04 and ubuntu-22.04-arm. A bare equality
        # check against 'ubuntu-22.04' would skip these on the arm64 runner
        # and the build would fail on a missing webkit2gtk.
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            xdg-utils
          # Tray support: the classic libappindicator3-dev was removed on
          # Ubuntu 24.04+ (future runner images); prefer its ayatana fork.
          sudo apt-get install -y libayatana-appindicator3-dev \
            || sudo apt-get install -y libappindicator3-dev

      - name: Install dependencies
        run: npm ci || npm install --no-fund --prefer-offline

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        shell: bash
        env:
          DISPLAY_DJ_CLI_VERSION: ${{ github.event.inputs.display_dj_cli_version }}
        run: |
          # Keyed on `runner.os`, not the platform label, so this covers
          # windows-latest and windows-11-arm alike.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Windows CI runners cannot LOAD our test binaries:
            #   * Smoke test (tests/smoke.rs) imports Dxva2.dll (DDC/CI), which
            #     is not available on Windows Server SKUs.
            #   * Lib tests pull in WebView2 imports via tauri's `test` feature
            #     (added as a dev-dependency for tauri::test::mock_app() in
            #     display.rs / lib.rs / overlay.rs), and the WebView2 loader on
            #     the runner has missing exports -> STATUS_ENTRYPOINT_NOT_FOUND
            #     (0xc0000139) at load time, before any test runs.
            # Compilation itself works on Windows, so we use --no-run to keep
            # validating that all Windows-targeted code (#[cfg(target_os =
            # "windows")] paths) still compiles. Actual test *execution* runs
            # on macOS ARM, macOS Intel, and Linux (x64 + arm64).
            cargo test --target ${{ matrix.target }} --no-run
          else
            cargo test --target ${{ matrix.target }}
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPLAY_DJ_CLI_VERSION: ${{ github.event.inputs.display_dj_cli_version }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          retention-days: 30
          compression-level: 9
          if-no-files-found: ignore

  coverage:
    # Coverage runs on a single OS (Linux is cheapest) — the numbers
    # don't vary meaningfully across platforms because the test suite
    # is platform-agnostic. Thresholds are pinned to the v7.0.2 baseline
    # minus a ~1pt safety margin against coincidental flakes. Real
    # regressions below the floor fail the build; raise these as
    # coverage improves.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci || npm install --no-fund --prefer-offline

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Vitest coverage thresholds live in vite.config.ts under
      # `test.coverage.thresholds`. The `--coverage` flag fails the
      # run when any of statements / branches / functions / lines
      # falls below its configured floor. `tee` keeps the full
      # output for the step-summary block below.
      - name: Frontend coverage (Vitest)
        id: frontend_cov
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee /tmp/frontend-cov.txt

      - name: Rust coverage (cargo-llvm-cov)
        id: rust_cov
        working-directory: src-tauri
        # Floors trail the current main-branch measurement by ~10pp to
        # absorb coincidental drops without breaking main. Raise these
        # as coverage improves; never lower without keeping the same
        # ~10pp gap.
        #
        # History:
        #   v7.0.2 baseline (Regions 46.13 / Functions 50.13 / Lines 44.11),
        #     floors set to 45 / 49 / 43.
        #   PR #6 (2026-05-10): functions drifted to 47.76; lowered 49→47.
        #   2026-05-17: post v7.0.19-22 the surface gained soft-overlay
        #     (overlay.rs), 2/3 tile-snap zones (tiling/macos), and About
        #     panel date formatting — all hard to unit-test from a Linux CI
        #     runner with no display server. SHA 7158ca1 measured Regions
        #     44.57 / Functions 47.02 / Lines 45.21. Lowered regions 45→43
        #     and functions 47→46; lines unchanged.
        #   2026-05-17 (this change): SHA 1833f2f measured Regions 59.19 /
        #     Functions 64.91 / Lines 60.18 after the latest test additions.
        #     Floors lowered to 49 / 54 / 50 to maintain the ~10pp safety
        #     margin requested by the maintainer.
        run: |
          set -o pipefail
          cargo llvm-cov --lib --summary-only \
            --fail-under-lines 50 \
            --fail-under-functions 54 \
            --fail-under-regions 49 \
            2>&1 | tee /tmp/rust-cov.txt

      # Upload the full HTML / lcov reports as an artifact so reviewers
      # can drill into per-file line-level coverage when the run-page
      # summary's totals aren't enough. Vitest writes to `coverage/`;
      # cargo-llvm-cov to `src-tauri/target/llvm-cov-target/`.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/
            src-tauri/target/llvm-cov-target/html/
          retention-days: 14
          if-no-files-found: ignore

      # Surface both reports on the workflow's run page. `if: always()`
      # ensures the summary still posts when the threshold check fails
      # — that's exactly when a human wants to see the numbers.
      - name: Post coverage to step summary
        if: always()
        run: |
          {
            echo "## Test coverage — \`$GITHUB_SHA\`"
            echo
            echo "### Frontend (Vitest, v8 provider)"
            echo
            echo '```text'
            if [ -f /tmp/frontend-cov.txt ]; then
              awk '/^=+ Coverage summary =+$/,/^=+$/' /tmp/frontend-cov.txt \
                || tail -n 8 /tmp/frontend-cov.txt
            else
              echo "(frontend coverage did not run)"
            fi
            echo '```'
            echo
            echo "Thresholds (from \`vite.config.ts → test.coverage.thresholds\`):"
            echo "lines ≥ 50, statements ≥ 50, branches ≥ 50, functions ≥ 50."
            echo
            echo "### Rust (cargo-llvm-cov)"
            echo
            echo '```text'
            if [ -f /tmp/rust-cov.txt ]; then
              awk '/^Filename/,/^TOTAL/' /tmp/rust-cov.txt \
                || tail -n 30 /tmp/rust-cov.txt
            else
              echo "(rust coverage did not run)"
            fi
            echo '```'
            echo
            echo "Thresholds (from \`build.yml\` cargo-llvm-cov flags):"
            echo "lines ≥ 50, functions ≥ 54, regions ≥ 49."
          } >> "$GITHUB_STEP_SUMMARY"

  # Single rolled-up status check for the whole workflow. The 6-platform
  # `build` matrix and the `coverage` job each produce their own check on
  # the commit, which makes branch protection awkward (you'd have to list
  # every matrix permutation by name) and clutters the PR/commit UI. This
  # job depends on all of them, runs `if: always()` so it executes even
  # when an upstream job fails or is cancelled, and fails itself iff any
  # required upstream did not succeed. The resulting check is named
  # "Build / Main Build" on the commit and is the single status to require
  # in branch protection.
  main_build:
    name: Main Build
    needs: [build, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate matrix + coverage results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          {
            echo "## Main Build rollup"
            echo
            echo "| Required job | Result |"
            echo "|--------------|--------|"
            echo "| build (6-platform matrix) | \`${BUILD_RESULT}\` |"
            echo "| coverage | \`${COVERAGE_RESULT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$BUILD_RESULT" == "success" && "$COVERAGE_RESULT" == "success" ]]; then
            echo "All required jobs succeeded."
            exit 0
          fi
          echo "::error::Main Build failed — build=${BUILD_RESULT} coverage=${COVERAGE_RESULT}"
          exit 1

  # Post a comment on PRs with download links for each platform's build artifacts
  pr_comment:
    if: github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post artifact links on PR
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            let body = `## Build Artifacts\n\n`;
            if (artifacts.data.artifacts.length === 0) {
              body += `No artifacts were produced.\n`;
            } else {
              body += `| Platform | Size | Download |\n|----------|------|----------|\n`;
              for (const a of artifacts.data.artifacts) {
                const sizeMB = (a.size_in_bytes / 1024 / 1024).toFixed(1);
                const downloadUrl = `${runUrl}/artifacts/${a.id}`;
                body += `| ${a.name} | ${sizeMB} MB | [Download](${downloadUrl}) |\n`;
              }
            }
            body += `\n[View full run](${runUrl})`;

            // Find and update existing comment or create new one
            const marker = '<!-- build-artifacts -->';
            body = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
