name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      display_dj_cli_version:
        description: 'display-dj-cli version to use (e.g. v0.4.1). Leave empty for default from package.json.'
        required: false
        default: ''
      tag:
        description: 'Release tag (e.g. v2.0.1). Leave empty to use version from package.json.'
        required: false
        default: ''
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  cleanup:
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true

  release:
    needs: [resolve-tag, cleanup]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPLAY_DJ_CLI_VERSION: ${{ github.event.inputs.display_dj_cli_version }}
        with:
          tagName: ${{ needs.resolve-tag.outputs.tag }}
          releaseName: 'Display DJ ${{ needs.resolve-tag.outputs.tag }}'
          releaseBody: |
            ## Display DJ ${{ needs.resolve-tag.outputs.tag }}

            ### Supported Platforms
            - **macOS** Apple Silicon (ARM64) - `.dmg`
            - **macOS** Intel (x64) - `.dmg`
            - **Windows** (x64) - `.msi` / `.exe`
            - **Linux** (x64) - `.deb` / `.AppImage`

            ### Requirements
            - Display control is handled by the bundled [display-dj CLI](https://github.com/synle/display-dj-cli) sidecar — no external tools needed on macOS or Windows
            - **Linux**: Install `ddcutil` and `brightnessctl` for display control: `sudo apt install ddcutil brightnessctl i2c-tools`
          releaseDraft: ${{ github.event.inputs.draft || 'true' }}
          prerelease: false
          args: ${{ matrix.args }}
