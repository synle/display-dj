name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install macOS display tools
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install m1ddc || true

      - name: Install dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Display DJ ${{ github.ref_name }}'
          releaseBody: |
            ## Display DJ ${{ github.ref_name }}

            ### Supported Platforms
            - **macOS** Apple Silicon (ARM64) - `.dmg`
            - **macOS** Intel (x64) - `.dmg`
            - **Windows** (x64) - `.msi` / `.exe`
            - **Linux** (x64) - `.deb` / `.AppImage`

            ### Requirements
            - **macOS**: Install `m1ddc` via Homebrew for external monitor control: `brew install m1ddc`
            - **Linux**: Install `ddcutil` and `brightnessctl`: `sudo apt install ddcutil brightnessctl i2c-tools`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
