name: Release Official

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      display_dj_cli_version:
        description: 'display-dj-cli version to use (e.g. v0.4.1). Leave empty for default from package.json.'
        required: false
        default: ''
      tag:
        description: 'Release tag (e.g. v2.0.1). Leave empty to use version from package.json.'
        required: false
        default: ''
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      release_notes:
        description: 'Custom release notes (optional). Prepended before the changelog.'
        required: false
        default: ''

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      body: ${{ steps.body.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release body
        id: body
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          USER_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          # Find the previous release tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | grep -v "^${TAG}$" | head -1)
          CURRENT_SHA=$(git rev-parse HEAD)

          # Build changelog from commits (max 10)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            CHANGELOG=$(git log --oneline --no-decorate -10 "$RANGE")
            TOTAL=$(git rev-list --count "$RANGE")
            PREV_SHA=$(git rev-parse "$PREV_TAG")
          else
            CHANGELOG=$(git log --oneline --no-decorate -10)
            TOTAL=$(git rev-list --count HEAD)
            PREV_SHA=""
          fi

          # Start building the body
          {
            echo "## Display DJ ${TAG}"
            echo ""

            # User-provided notes at the top
            if [ -n "$USER_NOTES" ]; then
              echo "$USER_NOTES"
              echo ""
            fi

            # Changelog section
            echo "### Changes"
            echo ""
            echo '```'
            echo "$CHANGELOG"
            if [ "$TOTAL" -gt 10 ]; then
              echo "... and $((TOTAL - 10)) more commits"
            fi
            echo '```'
            echo ""

            # Full diff link
            if [ -n "$PREV_SHA" ]; then
              echo "[Full diff: ${PREV_TAG}...${TAG}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG})"
              echo ""
            fi

            # Install instructions at the bottom
            echo "### Supported Platforms"
            echo "- **macOS** Apple Silicon (ARM64) - \`.dmg\`"
            echo "- **macOS** Intel (x64) - \`.dmg\`"
            echo "- **Windows** (x64) - \`.exe\`"
            echo "- **Linux** (x64) - \`.deb\` / \`.AppImage\`"
            echo ""
            echo "### Requirements"
            echo "- Display control is handled by the bundled [display-dj CLI](https://github.com/synle/display-dj-cli) sidecar — no external tools needed on macOS or Windows"
            echo "- **macOS Window Tiling**: Requires Accessibility permission. Go to System Settings > Privacy & Security > Accessibility and add Display DJ. See [setup instructions](https://github.com/synle/display-dj#window-tiling-macos)"
            echo "- **Linux**: Install \`ddcutil\` and \`brightnessctl\` for display control: \`sudo apt install ddcutil brightnessctl i2c-tools\`"
          } > body.md

          # Output as multiline string
          {
            echo "body<<BODY_EOF"
            cat body.md
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  cleanup:
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

  release:
    needs: [resolve-tag, cleanup]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPLAY_DJ_CLI_VERSION: ${{ github.event.inputs.display_dj_cli_version }}
          TAURI_RELEASE: 'true'
        with:
          tagName: ${{ needs.resolve-tag.outputs.tag }}
          releaseName: 'Display DJ ${{ needs.resolve-tag.outputs.tag }}'
          releaseBody: ${{ needs.resolve-tag.outputs.body }}
          releaseDraft: ${{ github.event.inputs.draft }}
          prerelease: false
          args: ${{ matrix.args }}
