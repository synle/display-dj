name: Release Official

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      display_dj_cli_version:
        description: 'display-dj-cli version to use (e.g. v0.4.1). Leave empty for default from package.json.'
        required: false
        default: ''
      tag:
        description: 'Release tag (e.g. v2.0.1). Leave empty to use version from package.json.'
        required: false
        default: ''
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      release_notes:
        description: 'Custom release notes (optional). Prepended before the changelog.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pre.outputs.tag }}
      sha: ${{ steps.pre.outputs.sha }}
    steps:
      - uses: actions/checkout@v6

      # Guard against shipping a bogus tag. Resolve in the same
      # priority order as begin-release (input → tag-ref → file)
      # and require strict semver. Aborts BEFORE the draft is
      # created so no cleanup is needed.
      #
      # Why this exists (2026-05-10): the old expression
      # `inputs.tag || github.ref_name` resolved to "main" on a
      # workflow_dispatch from the default branch and produced a
      # `vmain` release on display-dj. This guard + the safer
      # `version:` expression below close that bug for good.
      - name: Validate resolved tag (fail fast)
        run: |
          set -euo pipefail
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            CANDIDATE="${INPUT_TAG#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            CANDIDATE="${GITHUB_REF#refs/tags/v}"
          else
            CANDIDATE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf-8')).version)")
          fi
          if [[ ! "$CANDIDATE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.]+)?$ ]]; then
            {
              echo "::error::Resolved tag 'v${CANDIDATE}' is not strict semver."
              echo "::error::Source priority: inputs.tag → refs/tags/v* → src-tauri/tauri.conf.json#version."
              echo "::error::Fix one of those before re-running."
              echo "::error::Guard added 2026-05-10 after a 'vmain' release was produced by an unguarded fallback to github.ref_name."
            } >&2
            exit 1
          fi
          echo "Tag candidate valid: v${CANDIDATE}"

      - uses: synle/workflows/actions/release/begin-release@main
        id: pre
        with:
          mode: official
          project_name: Display DJ
          # Resolution order: explicit input → tag-ref push → version_file.
          # We DO NOT fall back to github.ref_name unconditionally.
          # On a workflow_dispatch from main (no tag input) that
          # resolved to "main" and produced a `vmain` release on
          # 2026-05-10. The guard step above enforces this too.
          version: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
          version_file: src-tauri/tauri.conf.json

  build:
    needs: [prepare]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          # Native arm64 build on GitHub's Windows 11 arm64 runner. Ships
          # Display DJ_<version>_arm64-setup.exe next to the x64 installer so
          # Windows-on-ARM users get a native binary instead of x64 emulation.
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          # Native arm64 Linux build. Ships _arm64.deb and _aarch64.AppImage
          # (Tauri uses a different arch suffix per bundle format).
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        # Matches ubuntu-22.04 and ubuntu-22.04-arm alike.
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            xdg-utils

      - name: Install dependencies
        run: npm ci || npm install --no-fund --prefer-offline

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPLAY_DJ_CLI_VERSION: ${{ inputs.display_dj_cli_version }}
          TAURI_RELEASE: 'true'
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Display DJ ${{ needs.prepare.outputs.tag }}'
          releaseBody: 'Build in progress...'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  release:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: synle/workflows/actions/release/end-release@main
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          project_name: Display DJ
          mode: official
          build_result: ${{ needs.build.result }}
          sha: ${{ needs.prepare.outputs.sha }}
          user_notes: ${{ inputs.release_notes }}
          extra_body_path: .github/release-body-static.md
