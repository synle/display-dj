[package]
name = "display-dj"
version = "0.0.0"
description = "Cross-platform monitor brightness and dark mode control"
authors = ["Sy Le"]
edition = "2021"

[lib]
name = "display_dj_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json = "=1.0.154"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dirs = "=7.0.0"
log = "=0.4.34"
env_logger = "=0.11.11"
open = "=5.4.5"
# Preserve the OS-native trust backend and disabled ALPN instead of adopting new TLS defaults.
reqwest = { version = "=0.13.5", default-features = false, features = [
  "json",
  "blocking",
  "native-tls-no-alpn",
  "charset",
  "http2",
  "system-proxy",
] }
chrono = "=0.4.45"
keepawake = "=0.6.1"
tauri-plugin-dialog = "=2.8.3"
md5 = "=0.8.1"
zip = "=9.1.2"
ddc = "=0.2.2"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "test"] }
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "=0.2.7"
block2 = "=0.6.2"
ddc-macos = "=0.2.2"
libc = "=0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", features = ["randr"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.58.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Shutdown",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
] }
ddc-winapi = "=0.2.2"
winapi = { version = "=0.3.9", features = ["wingdi", "windef"] }

# `panic = "unwind"` is required so that `std::panic::catch_unwind` in the
# macOS Tile Snap NSEvent global monitor (tiling/macos.rs) actually catches
# panics. With `panic = "abort"`, a panic in that ObjC-block handler bypasses
# `catch_unwind` and calls `abort()`, which has crashed the bundled app
# multiple times in the field (SIGABRT in `GlobalObserverHandler`). Slightly
# larger binary in exchange for not aborting on a recoverable handler bug.
[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
