[package]
name = "display-dj"
version = "2.0.0"
description = "Cross-platform monitor brightness, contrast, and dark mode control"
authors = ["Sy Le"]
edition = "2021"

[lib]
name = "display_dj_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
open = "5"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
